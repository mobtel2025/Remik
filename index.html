<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobtel Remik Online</title>
    <style>
        :root {
            --table-green: #2e7d32;
            --card-bg: #ffffff;
            --chat-bg: rgba(20, 20, 20, 0.9);
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--table-green);
            color: #fff;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        
        /* Lobby Styles */
        #lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #388e3c, #1b5e20);
        }
        .lobby-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 300px;
        }
        h1 { margin-top: 0; font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        button {
            background-color: #fbc02d;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            transition: 0.2s;
            color: #000;
        }
        button:hover { background-color: #f9a825; transform: scale(1.05); }
        input[type="text"], select {
            padding: 12px;
            font-size: 1.1em;
            border-radius: 6px;
            border: none;
            margin: 10px 0;
            width: 80%;
            text-align: center;
            box-sizing: border-box;
        }
        .settings-group {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        /* Game Area Styles */
        #game-container {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: row;
        }
        
        /* Make table area responsive and handle overflow */
        #table-area {
            flex: 1;
            position: relative;
            background: radial-gradient(ellipse at center, #4caf50 0%, #2e7d32 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto; /* Changed to auto to allow scrolling if needed on small screens */
            padding: 20px; /* Add some padding so elements don't touch edges directly */
        }

        /* Player Positions - adjusted for better mobile viewing */
        .player-slot {
            position: absolute;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px; /* Reduced padding */
            border-radius: 10px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.2);
            display: none;
            z-index: 5; /* Ensure they are above table center */
        }
        .player-slot.active { display: block; }

        /* Adjusted positioning to prevent overlapping */
        .player-1 { bottom: 20px; left: 50%; transform: translateX(-50%); width: auto; min-width: 200px; display: block; z-index: 10; } /* Ty zawsze widoczny */
        .player-2 { left: 10px; top: 50%; transform: translateY(-50%); } 
        .player-3 { top: 10px; left: 25%; transform: translateX(-50%); } 
        .player-4 { top: 10px; right: 25%; transform: translateX(50%); } 
        .player-5 { right: 10px; top: 50%; transform: translateY(-50%); } 

        .center-table {
            display: flex;
            gap: 15px; /* Reduced gap */
            background: rgba(255,255,255,0.1);
            padding: 20px; /* Reduced padding */
            border-radius: 20px;
            z-index: 1; /* Keep below players if screen is very small */
        }
        
        .card-pile {
            width: 60px; /* Smaller cards for mobile */
            height: 90px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            font-size: 0.9em;
        }
        .deck { background: repeating-linear-gradient(45deg, #b71c1c, #b71c1c 10px, #fff 10px, #fff 20px); color: transparent; }

        /* Chat Area - adjust for mobile */
        #chat-area {
            width: 300px; /* Slightly narrower */
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
            border-left: 2px solid #555;
            z-index: 20;
        }
        
        /* Media query for smaller screens (mobile) */
        @media (max-width: 768px) {
            #game-container {
                flex-direction: column; /* Stack table and chat vertically */
            }
            #table-area {
                height: 60vh;
                flex: none;
            }
            #chat-area {
                width: 100%;
                height: 40vh;
                border-left: none;
                border-top: 2px solid #555;
            }
            
            /* Further adjust player positions for vertical stacking */
            .player-2 { left: 5px; top: 40%; }
            .player-5 { right: 5px; top: 40%; }
            .player-3 { top: 5px; left: 30%; }
            .player-4 { top: 5px; right: 30%; }
            .player-1 { bottom: 5px; }
            
            .center-table {
                padding: 10px;
            }
        }

        .chat-header {
            padding: 10px;
            background: #111;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #333;
            word-wrap: break-word; /* Ensure long IDs don't overflow */
        }
        #chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg { background: #333; padding: 8px; border-radius: 8px; font-size: 0.85em; word-wrap: break-word; }
        .msg.system { background: transparent; color: #fbc02d; font-style: italic; text-align: center; }
        .msg .sender { font-weight: bold; color: #4caf50; margin-right: 5px; }
        
        .chat-input-area {
            display: flex;
            padding: 8px;
            background: #000;
        }
        .chat-input-area input {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            margin-right: 5px;
            font-size: 0.9em;
        }
        .chat-input-area button {
            margin: 0;
            padding: 8px 12px;
            font-size: 0.9em;
        }

        /* Hand representation */
        .hand {
            display: flex;
            justify-content: center;
            gap: -20px; /* Reduced negative gap so cards overlap less tightly */
            margin-top: 5px;
        }
        .card {
            width: 40px; /* Smaller cards in hand */
            height: 60px;
            background: white;
            border-radius: 4px;
            color: black;
            border: 1px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            margin-left: -10px;
            box-shadow: -1px 0 3px rgba(0,0,0,0.2);
            transition: 0.2s;
            position: relative; /* Needed for hover to work well with negative margins */
        }
        .card:hover { transform: translateY(-10px); z-index: 10; }
        .card.red { color: red; }
    </style>
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div id="lobby">
        <div class="lobby-box">
            <h1>Mobtel Remik Online</h1>
            <p>Graj ze znajomymi (od 2 do 5 graczy)</p>
            <hr style="border-color: #555; margin: 20px 0;">
            
            <div class="settings-group">
                <label for="playerCount" style="font-weight: bold;">Ilu graczy będzie przy stole?</label>
                <select id="playerCount">
                    <option value="2">2 graczy</option>
                    <option value="3">3 graczy</option>
                    <option value="4">4 graczy</option>
                    <option value="5" selected>5 graczy</option>
                </select>
            </div>
            
            <button onclick="createRoom()">Stwórz nowy stół</button>
            
            <p style="margin: 20px 0; color: #ccc;">LUB</p>
            
            <input type="text" id="joinCode" placeholder="Wpisz kod stołu...">
            <br>
            <button onclick="joinRoom()" style="background-color: #4caf50; color: white;">Dołącz do gry</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-container">
        
        <!-- Game Table -->
        <div id="table-area">
            
            <!-- Inni gracze -->
            <div class="player-slot player-3" id="ui-player-3">Gracz 3<div class="hand">🂠 🂠</div></div>
            <div class="player-slot player-4" id="ui-player-4">Gracz 4<div class="hand">🂠 🂠</div></div>
            <div class="player-slot player-2" id="ui-player-2">Gracz 2<div class="hand">🂠<br>🂠</div></div>
            <div class="player-slot player-5" id="ui-player-5">Gracz 5<div class="hand">🂠<br>🂠</div></div>

            <div class="center-table">
                <div class="card-pile deck" title="Pobierz kartę">Talia</div>
                <div class="card-pile discard-pile" style="color:red;" title="Stos odrzuconych">♥ 7</div>
            </div>

            <!-- Ty -->
            <div class="player-slot player-1 active" id="ui-player-1">
                Ty
                <div class="hand" id="my-hand">
                    <div class="card">♠ A</div>
                    <div class="card red">♥ K</div>
                    <div class="card">♣ 10</div>
                    <div class="card red">♦ 5</div>
                    <div class="card">♠ 2</div>
                </div>
            </div>
            
        </div>

        <!-- Chat Sidebar -->
        <div id="chat-area">
            <div class="chat-header">
                Pokój: <span id="room-id-display">---</span>
                <br>
                <span id="room-capacity" style="font-size: 0.8em; color: #ccc;"></span>
                <br>
                <button onclick="copyInvite()" style="padding: 5px 10px; font-size: 0.8em; margin-top: 5px;">Kopiuj zaproszenie</button>
            </div>
            <div id="chat-messages">
                <div class="msg system">Witaj w pokoju! Poczekaj na innych graczy.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Napisz wiadomość..." onkeypress="handleEnter(event)">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>

    </div>

    <script>
        let currentRoom = null;
        let playerName = "Gracz_" + Math.floor(Math.random() * 1000);
        let roomMaxPlayers = 5;

        function createRoom() {
            // Pobierz wybraną liczbę graczy
            roomMaxPlayers = parseInt(document.getElementById('playerCount').value);
            currentRoom = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            enterGame(currentRoom, roomMaxPlayers);
            addSystemMessage(`Stworzyłeś stół dla ${roomMaxPlayers} graczy! Twój kod to: ${currentRoom}`);
        }

        function joinRoom() {
            const code = document.getElementById('joinCode').value.trim().toUpperCase();
            if (code.length > 0) {
                // Here we would ideally fetch the room capacity from a server.
                // For now, we'll try to extract it if the user pasted the full invite message
                let maxP = 5; // default
                if(code.includes("STÓŁ NA") && code.includes("GRACZY")) {
                     const match = code.match(/STÓŁ NA (\d+) GRACZY/i);
                     if(match && match[1]) {
                         maxP = parseInt(match[1]);
                     }
                }
                
                // Try to extract just the code if they pasted the whole message
                let actualCode = code;
                const codeMatch = code.match(/KOD STOŁU TO:\s*([A-Z0-9]+)/i);
                if(codeMatch && codeMatch[1]) {
                    actualCode = codeMatch[1];
                }

                currentRoom = actualCode.substring(0, 6); // ensure max 6 chars if they pasted weirdly
                enterGame(currentRoom, maxP); 
                addSystemMessage("Dołączyłeś do stołu: " + currentRoom);
            } else {
                alert("Proszę wpisać poprawny kod stołu.");
            }
        }

        function enterGame(roomCode, maxPlayers) {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            document.getElementById('room-id-display').innerText = roomCode;
            document.getElementById('room-capacity').innerText = `Liczba miejsc: ${maxPlayers}`;
            
            setupTable(maxPlayers);
        }

        function setupTable(maxPlayers) {
            // Najpierw ukryj miejsca innych graczy
            document.getElementById('ui-player-2').classList.remove('active');
            document.getElementById('ui-player-3').classList.remove('active');
            document.getElementById('ui-player-4').classList.remove('active');
            document.getElementById('ui-player-5').classList.remove('active');

            // Rozmieść graczy na wizualizacji stołu zależnie od tego, ilu ich gra:
            if (maxPlayers === 2) {
                document.getElementById('ui-player-3').classList.add('active'); // Przeciwnik z góry
            }
            if (maxPlayers >= 3) {
                document.getElementById('ui-player-3').classList.add('active'); // Przeciwnik z góry
                document.getElementById('ui-player-2').classList.add('active'); // Przeciwnik z lewej
            }
            if (maxPlayers >= 4) {
                document.getElementById('ui-player-4').classList.add('active'); // Przeciwnik z prawej-góry
            }
            if (maxPlayers === 5) {
                document.getElementById('ui-player-5').classList.add('active'); // Przeciwnik z prawej-dół
            }
        }

        function copyInvite() {
            const inviteText = `Cześć! Zagrajmy w Remika (stół na ${roomMaxPlayers} graczy). Mój kod stołu to: ${currentRoom}`;
            navigator.clipboard.writeText(inviteText).then(() => {
                alert("Skopiowano zaproszenie do schowka!");
            }).catch(err => {
                // Fallback for older browsers
                const tempInput = document.createElement("input");
                tempInput.value = inviteText;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                alert("Skopiowano zaproszenie do schowka!");
            });
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text) {
                const msgBox = document.getElementById('chat-messages');
                const msgEl = document.createElement('div');
                msgEl.className = 'msg';
                msgEl.innerHTML = `<span class="sender">${playerName}:</span> ${text}`;
                msgBox.appendChild(msgEl);
                msgBox.scrollTop = msgBox.scrollHeight;
                
                input.value = '';
            }
        }

        function addSystemMessage(text) {
            const msgBox = document.getElementById('chat-messages');
            const msgEl = document.createElement('div');
            msgEl.className = 'msg system';
            msgEl.innerText = text;
            msgBox.appendChild(msgEl);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

    </script>
</body>
</html>
